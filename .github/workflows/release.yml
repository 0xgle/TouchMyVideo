name: Release

# Push a tag like v2.0.0 to build installers for every OS and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:react
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: touchmyvideo-${{ matrix.os }}
          path: |
            app/dist-electron/*.exe
            app/dist-electron/*.dmg
            app/dist-electron/*.AppImage

  release:
    needs: build
    # Publish whatever platforms built, even if one of them failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Zip the browser extension
        run: cd extension && zip -r ../out/TouchMyVideo-extension-${GITHUB_REF_NAME}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
