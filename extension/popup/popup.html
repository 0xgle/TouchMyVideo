<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true"></span>
    <strong>TouchMyVideo</strong>
    <span id="status" class="status" data-state="checking"></span>
  </header>

  <section id="page" class="page">
    <div id="title" class="title"></div>
    <div id="host" class="host"></div>
  </section>

  <section id="ready" hidden>
    <div class="seg" role="group">
      <button type="button" data-mode="video" aria-pressed="true" data-i18n="video"></button>
      <button type="button" data-mode="audio" aria-pressed="false" data-i18n="audio"></button>
    </div>
    <label class="row" id="qualityRow">
      <span data-i18n="quality"></span>
      <select id="quality">
        <option value="" data-i18n="best"></option>
        <option value="2160">4K</option>
        <option value="1440">1440p</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
      </select>
    </label>
    <button id="go" class="primary" type="button" data-i18n="download"></button>
  </section>

  <section id="offline" hidden>
    <p data-i18n="launchHint"></p>
    <button id="launch" class="primary" type="button" data-i18n="launch"></button>
  </section>

  <p id="result" class="result" role="status" aria-live="polite"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
